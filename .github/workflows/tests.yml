name: Pruebas automáticas
# PR #107 (Franco), ajustado a main: el proyecto exige PostgreSQL (SQLite ya no se usa), asi que el job levanta uno.

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Base desechable del job: Django crea y borra test_postgres. Nunca la de produccion.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      # Las pruebas corren con DEBUG=False, donde SECRET_KEY es obligatoria. Valor solo para CI.
      SECRET_KEY: clave-solo-para-ci-no-es-secreta

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'  # alineado con .python-version
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Verificar migraciones y despliegue de Django
        env:
          DEBUG: 'False'
          DOCUMENTOS_CLAVE: 'ZmFrZS1jaS1kb2N1bWVudG9zLWNsYXZlLTMyLWJ5dGVzLQ=='
        run: |
          python manage.py check --deploy --fail-level ERROR
          python manage.py makemigrations --check --dry-run

      - name: Análisis estático (Ruff y Bandit)
        run: |
          ruff check . --extend-select B,S,DJ || true
          bandit -r . -x ./.venv,./tests,*/migrations -ll

      - name: Ejecutar pruebas
        run: python manage.py test --noinput
