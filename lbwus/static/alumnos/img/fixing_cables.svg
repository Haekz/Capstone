<svg width="128" height="128" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <style>
    rect { shape-rendering: crispEdges; }
    .spark { animation: flash 0.3s infinite alternate steps(2, end); }
    .spark2 { animation: flash 0.2s infinite alternate steps(2, end); }
    .arm { transform-origin: 16px 18px; animation: hammer 0.3s infinite alternate steps(2, end); }
    @keyframes flash {
      0% { opacity: 0; }
      100% { opacity: 1; fill: #f1c40f; }
    }
    @keyframes hammer {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(-25deg); }
    }
  </style>
  
  <!-- background / cables -->
  <rect x="0" y="28" width="32" height="4" fill="#2c3e50"/>
  <!-- Broken cable wire -->
  <rect x="14" y="27" width="8" height="2" fill="#e74c3c"/>
  <rect x="15" y="26" width="2" height="2" fill="#f1c40f"/>
  <rect x="19" y="26" width="2" height="2" fill="#f1c40f"/>
  
  <!-- Sparks -->
  <rect class="spark" x="14" y="23" width="2" height="2" fill="#f39c12"/>
  <rect class="spark2" x="17" y="20" width="2" height="2" fill="#f1c40f"/>
  <rect class="spark" x="20" y="24" width="2" height="2" fill="#f39c12"/>

  <!-- Character Legs -->
  <rect x="10" y="24" width="4" height="4" fill="#2980b9"/>
  
  <!-- Body -->
  <rect x="8" y="14" width="10" height="10" fill="#3498db"/>
  <!-- Straps (Overalls) -->
  <rect x="9" y="14" width="2" height="10" fill="#2980b9"/>
  <rect x="15" y="14" width="2" height="10" fill="#2980b9"/>
  
  <!-- Head -->
  <rect x="9" y="6" width="8" height="8" fill="#fada5e"/>
  <!-- Eyes -->
  <rect x="11" y="9" width="1" height="2" fill="#000"/>
  <rect x="14" y="9" width="1" height="2" fill="#000"/>
  
  <!-- Hard hat -->
  <rect x="8" y="4" width="10" height="3" fill="#e67e22"/>
  <rect x="10" y="2" width="6" height="2" fill="#e67e22"/>

  <!-- Arm holding wrench -->
  <g class="arm">
    <!-- Arm -->
    <rect x="12" y="16" width="8" height="3" fill="#fada5e"/>
    <rect x="12" y="16" width="4" height="3" fill="#3498db"/> <!-- sleeve -->
    <!-- Wrench -->
    <rect x="18" y="14" width="2" height="12" fill="#95a5a6"/>
    <rect x="17" y="12" width="4" height="2" fill="#95a5a6"/>
    <rect x="17" y="26" width="4" height="2" fill="#95a5a6"/>
  </g>
</svg>
