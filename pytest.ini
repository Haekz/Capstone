[pytest]
# Misma suite que `python manage.py test`, corrida con pytest (docs/PRUEBAS.md).
DJANGO_SETTINGS_MODULE = lbwus.settings
python_files = test*.py tests.py tests_*.py
testpaths =
    tests
    alumnos
    user_profesor
    admin_portal
    apoderados
    resenas
    comunidad
    agenda
    mensajes
    notificaciones
    observaciones
    requerimientos
    soporte
    supresiones
    lbwus
# -p no:randomly: orden fijo, como manage.py test. Para buscar pruebas que
# dependen del orden: pytest -p randomly (ver docs/PRUEBAS.md).
addopts = -ra --strict-markers -p no:randomly
markers =
    integracion_atlas: contra MongoDB Atlas real; se omiten sin MONGODB_URI y MONGODB_INTEGRACION=1
    postgres: dependen de bloqueos o concurrencia reales de PostgreSQL
    lento: tardan mas de un segundo
