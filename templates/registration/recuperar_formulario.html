{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Contraseña — LBWUS</title>
    <link rel="icon" href="{% static 'alumnos/img/Logo.png' %}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="{% static 'recuperar.css' %}">
</head>
<body>
    <div class="card">
        <div class="avatar">
            <i class="bi bi-key-fill"></i>
        </div>
        <h1>Recuperar Contraseña</h1>
        <p class="sub">Ingresa tu correo para enviarte instrucciones</p>

        <form method="post">
            {% csrf_token %}
            
            {% if form.errors %}
            <div class="error">
                Por favor, introduce una dirección de correo válida.
            </div>
            {% endif %}

            <div class="campo">
                <i class="bi bi-envelope-fill"></i>
                <input type="email" name="email" id="id_email" placeholder="Correo Electrónico" required autocomplete="email">
            </div>

            <button type="submit" class="btn">Enviar enlace</button>
        </form>

        <a href="{% url 'login' %}" class="btn-home">
            <i class="bi bi-arrow-left"></i> Volver al Login
        </a>
    </div>
</body>
</html>
