{# Grafico de lineas del panel (admin_portal/metricas.grafico). #}
{# Recibe: grafico, id (unico en la pagina) y descripcion (texto accesible; se le agrega el resumen). #}
<svg class="chart-svg" viewBox="0 0 600 220" role="img" aria-labelledby="{{ id }}-titulo">
    <title id="{{ id }}-titulo">{{ descripcion }}: {{ grafico.resumen }}</title>
    <!-- Líneas de cuadrícula horizontal -->
    <line x1="50" y1="30" x2="550" y2="30" stroke="var(--border)" stroke-dasharray="4,4" />
    <line x1="50" y1="80" x2="550" y2="80" stroke="var(--border)" stroke-dasharray="4,4" />
    <line x1="50" y1="130" x2="550" y2="130" stroke="var(--border)" stroke-dasharray="4,4" />
    <line x1="50" y1="180" x2="550" y2="180" stroke="var(--border)" />

    <!-- Valores del eje Y -->
    {% for marca in grafico.marcas %}
    <text x="25" y="{{ marca.y|add:4 }}" fill="var(--text-muted)" font-size="11">{{ marca.valor }}</text>
    {% endfor %}

    <!-- Área sombreada debajo de la línea -->
    <path class="chart-area-path" d="{{ grafico.area }}" fill="url(#{{ id }}-degradado)" opacity="0.15" />

    <!-- Línea del gráfico continua -->
    <path class="chart-line-path" d="{{ grafico.linea }}" fill="none" stroke="var(--primary)" stroke-width="4" stroke-linecap="round" />

    <!-- Puntos (al pasar el mouse muestran el período y la cantidad) y períodos del eje X -->
    {% for punto in grafico.puntos %}
    <circle class="chart-point" cx="{{ punto.x }}" cy="{{ punto.y }}" r="6" fill="var(--primary)" stroke="var(--bg-card)" stroke-width="2"><title>{{ punto.etiqueta }}: {{ punto.cantidad }}</title></circle>
    <text x="{{ punto.x }}" y="204" fill="var(--text-muted)" font-size="11" text-anchor="middle">{{ punto.etiqueta }}</text>
    {% endfor %}

    <!-- Definición del degradado -->
    <defs>
        <linearGradient id="{{ id }}-degradado" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="var(--primary)" />
            <stop offset="100%" stop-color="transparent" />
        </linearGradient>
    </defs>
</svg>
